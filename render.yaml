services:
  - type: web
    name: sarichashma-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GROUP_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sarichashma-db
          property: connectionString
      - key: MINI_APP_URL
        value: https://sarichashma-miniapp.onrender.com
      - key: PORT
        value: 10000

  - type: web
    name: sarichashma-miniapp
    runtime: static
    staticPublishPath: ./miniapp
    buildCommand: echo "ready"

databases:
  - name: sarichashma-db
    plan: free
    region: frankfurt
